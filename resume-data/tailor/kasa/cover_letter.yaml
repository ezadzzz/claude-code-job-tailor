  content:
    letter_title: 'Cover Letter - Property Portfolio Finance Manager'
    opening_line: 'Dear Kasa Hiring Team,'
    body:
      - "I was staying at the Mint House in St. Petersburg when I noticed the signage had changed—'Mint House by Kasa.' That sparked a deep dive into the merger, and when I discovered this role, the alignment felt almost too perfect: a tech-forward hospitality company doubling its portfolio overnight, looking for someone to scale financial operations. As a systems thinker who spent three years building scalable finance infrastructure at Placemakr, I knew I had to reach out."

      - "At Placemakr, I owned financial reporting for ~15 properties and faced a familiar challenge—no standardized USALI reporting across the portfolio. So I taught myself the entire USALI 11th edition framework, mapped thousands of GL accounts, and built an automated conversion system that became permanent infrastructure for the organization. That self-driven approach to solving complex problems is how I operate, and it's exactly what Kasa needs as you integrate Mint House properties and scale toward 85+ units."

      - "What excites me most about Kasa is the commitment to automation and AI-driven operations. I share that mindset. When Gemini 2.5 Pro launched in December, I used it within days to complete a laundry cost analysis that would have taken weeks manually. The result: I identified a 76% cost increase that ownership had been scrutinizing for months, and negotiated $75K in annual savings. My manager and the property GMs were thrilled—we'd finally unlocked data that drove real decisions. That's the kind of initiative I'd bring to Kasa's finance team."

      - "I'd welcome the chance to discuss how my portfolio management experience and passion for process automation could support Kasa's growth. Stacie Powell, a former Placemakr colleague who now serves as a Portfolio GM at Kasa, encouraged me to apply. I'm available at your convenience."

    signature: |
      Sincerely,
      Eric X. Zdanowski
